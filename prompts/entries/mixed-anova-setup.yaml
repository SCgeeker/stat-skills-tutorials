id: mixed-anova-setup
title:
  zh: 混合設計 ANOVA 前的資料整形
  en: Reshaping data for a mixed ANOVA
analysis: rtutor
scenario:
  zh: 資料是寬格式（每個受試者一列、三個時間點三欄）加一個組別欄；想在 Rj 裡先確認長寬轉換是否正確，再回 jamovi 跑 Repeated Measures ANOVA。
  en: >-
    Data is in wide format (one row per subject, three time-point columns)
    plus a group column. You want to verify a long-format reshape in Rj
    before running the RM ANOVA in jamovi.
variables:
  - {role: id, type: nominal, n_levels: null}
  - {role: grouping, type: nominal, n_levels: 2}
  - {role: outcome, type: continuous, n_levels: null}
design: mixed
stat_goal: compare-k
prerequisites:
  - 確認 Rj 已安裝（否則 R tutor 會改教 Syntax Mode）
  - 三個時間點欄名記下來
persona: tutor
prompt:
  zh: |-
    資料 data 有 {id}、{group} 與三個時間點欄 {t1}、{t2}、{t3}。

    請依下列規則引導我，不要直接給完整解答：
    1. 只給程式骨架與 TODO 註解，引導我用 base R 或 rj_environment 裡有的套件轉成長格式。
    2. 印出每個受試者 × 時間點的列數，讓我自己核對。
    3. 不要幫我跑 ANOVA。
  en: |-
    data has {id}, {group}, and three time columns {t1}, {t2}, {t3}.

    Please guide me under these rules, without giving the full solution:
    1. Give only a skeleton with TODO comments, guiding me to reshape to long
       format using base R or packages already in rj_environment.
    2. Print the row count per subject x time point so I can verify it myself.
    3. Do not run the ANOVA for me.
system_prompt_override: null
expected:
  - 只用 `data`，不出現 read.csv / install.packages（R tutor 的硬規則）
  - 長格式列數 = n 受試者 × 3
  - 有一行驗證輸出（table 或 nrow）
check:
  - {step: code-read, what: 逐行讀：有無 setwd／檔案路徑／未列在 rj_environment 的套件}
  - {step: code-run, what: 貼進 Rj 執行；nrow 是否等於 n × 3；有錯誤訊息就原文貼回下一次問題}
  - {step: cross-check, what: 回 jamovi 用 ANOVA ▸ Repeated Measures ANOVA 跑寬格式原資料，比對描述統計是否與長格式一致}
stop_criteria:
  solved: code-run 列數正確且 cross-check 描述統計一致
  reopen: 列數不對或程式碼用了環境沒有的套件 → 把錯誤訊息貼回、換 consultant 要完整版
links:
  - {title: "psyteachr quant-fun (wrangling / ANOVA)", url: "https://psyteachr.github.io/quant-fun-v3/", license: "CC BY-SA 4.0"}
tested_with:
  - {date: 2026-09-08, provider: pending, model: pending, result: pending, note: "Phase 0 未實測；schema 與流程已就緒，待 Phase 1 補實測記錄"}
