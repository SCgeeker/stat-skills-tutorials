  - {date: 2026-09-08, provider: gemini, model: gemini-flash-latest, result: fail, note: "【針對 2026-09-09 修正前的提示詞】en 版實測（data/mixed-anova-setup_zhang2014_en.omv）。同一根因，錯誤位置 <text>:21:1。此版另有 table(data_long$# TODO: ...)，破壞更嚴重。此失效模式可重現，已列為 spot-the-error 候選題材。"}
  - {date: 2026-09-09, provider: pending, model: pending, result: pending, note: "提示詞已於 2026-09-09 修正：待填處改為開頭的變數指派、明令不得在運算式內寫註解、並要求程式碼在填值前即可通過語法檢查。修正後尚未實測，待以 gemini-flash-latest 中英各跑一次驗證語法錯誤是否消失。"}
