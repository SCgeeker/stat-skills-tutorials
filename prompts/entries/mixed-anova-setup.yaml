id: mixed-anova-setup
title:
  zh: 混合設計 ANOVA 前的資料整形
  en: Reshaping data for a mixed ANOVA
analysis: rtutor
scenario:
  zh: 資料是寬格式：每位受試者一列，兩個時間點各一欄（事前預測與事後實際），另有一個兩水準的組別欄。想在 Rj 裡先確認長寬轉換是否正確，再回 jamovi 跑混合設計 ANOVA。
  en: >-
    Data is in wide format: one row per participant, one column for each of two
    time points (a prediction beforehand and the actual rating afterwards), plus
    a two-level group column. You want to verify a long-format reshape in Rj
    before running the mixed ANOVA in jamovi.
variables:
  - {role: id, type: nominal, n_levels: null}
  - {role: grouping, type: nominal, n_levels: 2}
  - {role: outcome, type: continuous, n_levels: null}
design: mixed
stat_goal: compare-k
prerequisites:
  - zh: 確認 Rj 已安裝（否則 R tutor 會改教 Syntax Mode）
    en: Confirm Rj is installed (otherwise the R tutor will teach Syntax Mode instead).
  - zh: 兩個時間點欄名記下來
    en: Write down the two time-point column names.
persona: tutor
prompt:
  zh: |-
    資料 data 有 {id}、{group} 與兩個時間點欄 {t1}、{t2}。

    請依下列規則引導我，不要直接給完整解答：
    1. 待填處寫成開頭的變數指派、值放字串佔位符，引導我用 base R 或 rj_environment 裡有的套件轉成長格式。
    2. 印出每個受試者 × 時間點的列數，讓我自己核對。
    3. 不要幫我跑 ANOVA。
  en: |-
    data has {id}, {group}, and two time columns {t1}, {t2}.

    Please guide me under these rules, without giving the full solution:
    1. Put every blank I need to fill in as a variable assignment at the top of
       the script with a string placeholder as its value, and guide me to reshape
       to long format using base R or packages already in rj_environment.
    2. Print the row count per subject x time point so I can verify it myself.
    3. Do not run the ANOVA for me.
system_prompt_override: null
expected:
  - zh: 只用 `data`，不出現 read.csv / install.packages（R tutor 的硬規則）
    en: Uses only `data`, with no read.csv / install.packages (a hard rule for the R tutor)
  - zh: 程式碼在填入欄名前即可通過語法檢查；待填處是開頭的變數指派，不是寫在運算式裡的註解
    en: The code passes a syntax check before the column names are filled in; blanks are variable assignments at the top, not comments placed inside expressions
  - zh: 長格式列數 = n 受試者 × 2
    en: The long-format row count equals n subjects x 2
  - zh: 有一行驗證輸出（table 或 nrow）
    en: Includes one line of verification output (a table or nrow)
check:
  - step: code-read
    what:
      zh: 逐行讀：有無 setwd／檔案路徑／未列在 rj_environment 的套件
      en: Read line by line for setwd, file paths, or packages not listed in rj_environment
  - step: code-run
    what:
      zh: 先原樣貼進 Rj 執行，確認沒有語法錯誤（此時應只因欄名是佔位符而報找不到欄位）；再填入真實欄名重跑，確認 nrow 等於 n × 2。任何錯誤訊息都原文貼回下一次問題
      en: First paste it into Rj unchanged and confirm there is no syntax error (it should fail only because the placeholders are not real column names); then fill in the real names, rerun, and confirm nrow equals n x 2. Paste any error message back verbatim in the next question
  - step: cross-check
    what:
      zh: 回 jamovi 用 ANOVA ▸ Repeated Measures ANOVA 跑寬格式原資料，比對描述統計是否與長格式一致
      en: Go back to jamovi and run ANOVA ▸ Repeated Measures ANOVA on the original wide-format data, then compare the descriptive statistics against the long-format ones
stop_criteria:
  solved:
    zh: code-run 列數正確且 cross-check 描述統計一致
    en: The code-run row count is correct and the cross-check descriptive statistics agree.
  reopen:
    zh: 程式碼有語法錯誤、列數不對、或用了環境沒有的套件 → 把錯誤訊息貼回、換 consultant 要完整版
    en: The code has a syntax error, the row count is wrong, or it uses a package not available in the environment -> paste the error message back and ask the consultant persona for the full solution.
links:
  - {title: "psyteachr quant-fun (wrangling / ANOVA)", url: "https://psyteachr.github.io/quant-fun-v3/", license: "CC BY-SA 4.0"}
  - {title: "psyteachr analysis ch.13 Factorial ANOVA (Zhang et al. 2014 time capsule)", url: "https://psyteachr.github.io/analysis-v4/13-factorial-anova.html", license: "CC BY 4.0"}
tested_with:
  - {date: 2026-09-08, provider: gemini, model: gemini-flash-latest, result: fail, note: "【修正前的提示詞】zh 版，證據 data/mixed-anova-setup_zhang2014_v1_fail_zhTW.omv。code-run 失敗：貼進 Rj 得 <text>:23:1: unexpected symbol。根因是當時的提示詞要求「只給程式骨架與 TODO 註解」，模型因此把註解寫進 c() 括號內（cols = c(# TODO: ...)），R 的 # 吃掉整行剩餘內容連同右括號，運算式無法收尾。code-read 無紅旗：library(tidyverse) 確實存在於本機 Rj 套件庫。"}
  - {date: 2026-09-08, provider: gemini, model: gemini-flash-latest, result: fail, note: "【修正前的提示詞】en 版，證據 data/mixed-anova-setup_zhang2014_v1_fail_en.omv。同一根因，錯誤位置 <text>:21:1，另有 table(data_long$# TODO: ...)。此失效模式可重現，已列為 spot-the-error 題材。"}
  - {date: 2026-09-09, provider: gemini, model: gemini-flash-latest, result: pass, note: "修正後重測，zh 版，證據 data/mixed-anova-setup_zhang2014_v2_fix_zhTW.omv。expected 4/4：只用 data、無 read.csv/install.packages；待填處為開頭的變數指派（target_cols 等）且值為字串佔位符，填值前即可 parse；長格式 304 列（152 × 2）；有 table() 驗證輸出。check 三項齊備：code-read 無紅旗，code-run 在 Rj 零錯誤且每格為 1，cross-check 的 anovaRM 已跑（within = Time[T1,T2]、between = Condition）。判定依據為當次貼入 Rj 的程式碼與其執行結果，非 .omv 內顯示的回覆（見 data/README.md 的 submit 重跑陷阱）。"}
  - {date: 2026-09-09, provider: gemini, model: gemini-flash-latest, result: pass, note: "修正後重測，en 版，證據 data/mixed-anova-setup_zhang2014_v2_fix_en.omv。expected 4/4，待填處為 id_col / time_cols / time_col_name / score_col_name 四個開頭指派（此為當次貼入 Rj 執行的那份程式碼；.omv 現存的回覆是第三個樣本，其變數名為 id_var / time_cols / time_name / score_name）。Rj 執行零錯誤、304 列、每格為 1，anovaRM 同上。附帶觀察：該檔因 submit 重跑共產生三個回覆樣本（變數名分別為 id_col / time_cols / id_var），三者皆符合修正後的格式規範，為提示詞修正穩健的旁證。判定依據同 zh 版。"}
