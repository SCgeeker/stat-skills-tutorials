id: describe-first-look
title:
  zh: 拿到資料的第一眼該看什麼
  en: What to look at first
analysis: guider
scenario:
  zh: 剛載入一份實驗資料，想知道該先看哪些描述統計、以及哪些判斷需要看原始資料才做得到。
  en: >-
    You have just loaded an experiment's data and want to know which
    descriptive statistics to look at first, and which judgements need the raw
    data rather than a summary.
variables:
  - {role: outcome, type: continuous, n_levels: null}
  - {role: grouping, type: nominal, n_levels: 2}
  - {role: id, type: nominal, n_levels: null}
design: within
stat_goal: describe
prerequisites:
  - zh: 先把結果變項與分組變項都勾進 Variables to describe，否則 LLM 收不到它們的摘要
    en: Tick both the outcome and the grouping variable into Variables to describe, or the LLM will not receive their summaries.
  - zh: 記下每個水準的 n，等一下要拿來核對回覆引用的數字
    en: Write down the n for each level so you can check the numbers the reply cites.
persona: explainer
prompt:
  zh: |-
    {outcome} 是連續變項，{group} 有 {k} 個水準，{id} 是受試者編號。每位受試者在每個水準各有一筆資料。

    請用初學者聽得懂的方式回答：
    1. 我應該先看哪些描述統計？請給逐字選單路徑。
    2. 從這份摘要，你能判斷分布形狀嗎？如果不能，我該自己做什麼來判斷？
    3. 有哪些關於這份資料的問題，是你從摘要統計裡看不出來、只能由我自己看原始資料才知道的？
  en: |-
    {outcome} is continuous, {group} has {k} levels, and {id} identifies the
    participant. Each participant has one row per level.

    Please answer in beginner-friendly terms:
    1. Which descriptive statistics should I look at first? Give the exact menu path.
    2. Can you judge the shape of the distribution from this summary? If not, what
       should I do myself to judge it?
    3. Which questions about this data can you not answer from summary statistics,
       so that I have to look at the raw data myself?
system_prompt_override: null
expected:
  - zh: 給出 Exploration ▸ Descriptives 的逐字路徑，並說明 Split by 可依水準分開看
    en: Gives the verbatim path Exploration ▸ Descriptives, and mentions that Split by shows each level separately
  - zh: 明確承認摘要統計判斷不了分布形狀，並建議畫圖（直方圖或箱形圖）自行檢視
    en: States plainly that summary statistics cannot reveal distribution shape, and suggests plotting (a histogram or boxplot) to judge it
  - zh: 至少點出一件它看不到的事，例如哪一筆是離群值、遺漏的型態、或每位受試者的配對關係
    en: Names at least one thing it cannot see, such as which row is an outlier, the pattern of missingness, or the pairing between each participant's rows
  - zh: 不宣稱自己檢視過原始資料或個別觀察值
    en: Does not claim to have inspected the raw data or any individual observation
check:
  - step: path
    what:
      zh: 回覆中每條 "Analyses ▸ …" 路徑，在你的 jamovi 選單裡逐字點得到
      en: Every "Analyses ▸ …" path in the reply can be clicked verbatim in your own jamovi
  - step: number
    what:
      zh: 回覆引用的 n、mean、sd 與你在 Descriptives 面板看到的一致
      en: The n, mean, and sd cited in the reply match what you see in the Descriptives panel
  - step: assumption
    what:
      zh: 自己畫一次直方圖，看分布形狀是否與回覆的描述相容；回覆若根本沒描述形狀，這一步記為通過
      en: Plot a histogram yourself and check whether the shape is compatible with the reply; if the reply made no claim about shape, this step passes
stop_criteria:
  solved:
    zh: 四項 expected 全命中且 path 查核零錯 → 依建議執行
    en: All four expected elements are hit and the path check is clean -> follow the advice.
  reopen:
    zh: 回覆宣稱看得出分布形狀或指認了特定觀察值 → 記為越界，換 consultant persona 重問一次比對
    en: The reply claims to see the distribution shape or names a specific observation -> record it as overreaching and ask again with the consultant persona to compare.
links:
  - {title: "psyteachr Data Skills ch.2 Stroop (dataset source)", url: "https://psyteachr.github.io/data-skills-v3/stroop.html", license: "CC BY-SA 4.0"}
tested_with:
  - {date: 2026-09-16, provider: gemini, model: gemini-flash-latest, result: pass, note: "zh 版，persona=explainer，promptLang=zh，證據 data/describe-first-look_stroop_zhTW.omv、回覆副本 data/replies/describe-first-look_stroop_zhTW.md。expected 4/4：路徑 Analyses > Exploration > Descriptives 並指明 Split by；答「無法完全確定」分布形狀並要求自畫 Histogram 與看 Skewness/Kurtosis；點出四件摘要看不到的事，第一件正是「無法確認每人是否各 1 筆 congruent/incongruent」；全程未宣稱檢視過原始資料。check 三項齊備：path 比對本機 jmv/jamovi.yaml 逐字相符；number 817.7 / 811 / 418.9 / 1359 / 270 人 / 540 列 與 R 實算 817.7276 / 811.0353 / 418.9321 / 1358.5688 相符；assumption 已畫直方圖（08 descriptives/resources 內），回覆只給「大致對稱」的弱推論，與全體偏態 0.312 相容。"}
  - {date: 2026-09-16, provider: gemini, model: gemini-flash-latest, result: pass, note: "en 版，persona=explainer，promptLang 未設（en 預設），證據 data/describe-first-look_stroop_en.omv、回覆副本 data/replies/describe-first-look_stroop_en.md。expected 4/4，同 zh 版四項全中。此版在第 2 題更進一步：由 max 離 median 比 min 遠推出 possible slight right skew，並主動指出摘要看不出雙峰。R 實算全體偏態 0.312，該推論成立；分組後偏態僅 −0.077 與 −0.008，全體的右偏其實來自兩組平均數相差 147ms 的疊加。check 三項同 zh 版，另畫了第二張圖。"}
