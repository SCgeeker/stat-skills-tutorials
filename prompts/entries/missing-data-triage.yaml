id: missing-data-triage
title:
  zh: 遺漏值先分流再處理
  en: Triage missing data before you treat it
analysis: guider
scenario:
  zh: 摘要顯示某些變項遺漏比例不低，想知道先該做什麼、哪些決定 LLM 不能替你做。
  en: >-
    The summary shows non-trivial missingness in some variables. You want to
    know what to do first, and which decisions an LLM cannot make for you.
variables:
  - {role: outcome, type: continuous, n_levels: null}
  - {role: predictor, type: continuous, n_levels: null}
design: none
stat_goal: screen
prerequisites:
  - zh: 勾選所有你關心的變項再送出（摘要裡的「遺漏」欄是 LLM 唯一看得到的線索）
    en: Tick every variable you care about before you submit (the "Missing" column in the summary is the only clue the LLM can see).
persona: explainer
prompt:
  zh: |-
    摘要裡 {var_a} 遺漏 {pct_a}%、{var_b} 遺漏 {pct_b}%。

    請用初學者聽得懂的方式回答：
    1. 這個遺漏比例算不算嚴重？
    2. 我該先在 jamovi 用哪個分析看遺漏是否集中在某些組別（請給逐字選單路徑）？
    3. 哪些處理方式（例如刪除或插補）的選擇需要我自己根據研究設計決定、你無法替我判斷？
  en: |-
    The summary shows {var_a} has {pct_a}% missing and {var_b} has {pct_b}% missing.

    In beginner-friendly terms, please answer:
    1. Is this level of missingness serious?
    2. Which jamovi analysis (exact menu path) lets me see whether missingness clusters by group?
    3. Which treatment decisions (e.g. deletion vs. imputation) depend on my research design, so you cannot make them for me?
system_prompt_override: null
expected:
  - zh: 明確說明它看不到遺漏的「型態」（MCAR/MAR/MNAR 無法從摘要判斷）
    en: Clearly states it cannot see the "pattern" of missingness (MCAR/MAR/MNAR cannot be judged from the summary alone)
  - zh: 建議 Exploration ▸ Descriptives（Split by）或 Frequencies 之類真實路徑觀察分佈
    en: Suggests a real menu path such as Exploration ▸ Descriptives (Split by) or Frequencies to inspect the distribution
  - zh: 把「刪除 vs. 插補」的決定交回使用者，並說明依據
    en: Hands the "deletion vs. imputation" decision back to you, and explains the reasoning
check:
  - step: path
    what:
      zh: 路徑逐字核對
      en: Check the menu path word-for-word
  - step: number
    what:
      zh: 遺漏比例與 Descriptives 的 Missing 欄一致
      en: The missingness percentage matches the Missing column in Descriptives
  - step: cross-check
    what:
      zh: 換 consultant persona 再問一次，兩次的「交回使用者決定」清單是否一致
      en: Ask again with the consultant persona, and check whether the two "decisions handed back to you" lists agree
stop_criteria:
  solved:
    zh: 回覆明確承認摘要的極限且建議的觀察步驟可執行
    en: The reply clearly acknowledges the summary's limits and the suggested inspection step is actionable.
  reopen:
    zh: 回覆直接替你選了插補方法而未說明前提 → 記為「過度自信」案例，進 spot-the-error 練習
    en: The reply picks an imputation method for you outright without stating its assumptions -> log it as an "overconfidence" case and use it in the spot-the-error exercise.
links:
