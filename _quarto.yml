# _quarto.yml
# ---------------------------------------------------------------------------
# 主設定。單一站台同時含中英內容，由右上角的切換鈕決定顯示哪一種
# （assets/lang.css + _includes/lang-*.html）。
#
# ---------------------------------------------------------------------------

project:
  type: website
  output-dir: docs
  # 明確列出要 render 的內容，避免 Quarto 把根目錄下非站內文件
  # （README.md）當成站內頁面發佈；
  # prompts/generated/ 是 build-prompts.R 產出的「每條一頁」中間產物，
  # 內容已整併進 prompts/index.qmd，故不重複 render 成獨立頁面。
  render:
    - "*.qmd"
    - "literacy/*.qmd"
    - "prompts/*.qmd"
    - "verify/*.qmd"
    - "external/*.qmd"
    - "!README.md"
    - "!prompts/generated/"
  pre-render:
    - "Rscript tools/build-prompts.R"

lang: zh-TW

website:
  title: "stat-skills-tutorials"
  description: "與 AI 協作做統計的素養教程、情境化提示詞庫與生成結果查核清單"
  navbar:
    left:
      - href: index.qmd
        text: 首頁 / Home
      - href: literacy/01-what-the-llm-sees.qmd
        text: 協作素養 / Literacy
      - href: prompts/index.qmd
        text: 提示詞庫 / Prompts
      - href: verify/workflow.qmd
        text: 結果查核 / Verification
      - href: external/reading-map.qmd
        text: 外部教材導讀 / Reading Map
  sidebar:
    - title: "協作素養 / Literacy"
      contents:
        - literacy/01-what-the-llm-sees.qmd
        - literacy/02-one-answerable-question.qmd
        - literacy/03-criteria-first.qmd
        - literacy/04-which-analysis-which-persona.qmd
        - literacy/05-beyond-the-summary.qmd
        - literacy/06-after-the-answer.qmd
    - title: "提示詞庫 / Prompts"
      contents:
        - prompts/index.qmd
    - title: "生成結果查核 / Verification"
      contents:
        - verify/workflow.qmd
        - verify/checklist-guider.qmd
        - verify/checklist-rtutor.qmd
        - verify/spot-the-error.qmd
    - title: "外部教材導讀 / Reading Map"
      contents:
        - external/reading-map.qmd

format:
  html:
    theme: cosmo
    toc: true
    lang: zh-TW
    # 語言切換：單一站台同時含中英內容，由 assets/lang.css + _includes 控制
    # 顯示哪一語言。內容頁以 ::: {.zh} / ::: {.en} 標記。
    css:
      - assets/lang.css
    include-in-header:
      - _includes/lang-init.html
    include-after-body:
      - _includes/lang-toggle.html
