# _quarto-en.yml
# ---------------------------------------------------------------------------
# Quarto profile: en. 覆寫 _quarto.yml 的 lang / sidebar / render 清單，
# 對應 PROPOSAL.zh-TW.md §7.2：「_quarto-en.yml 覆寫 lang、sidebar 與
# render 清單；輸出到 docs/ 與 docs/en/」。
#
# Phase 0 範圍：L1 六課與 L3 查核清單目前只有部分完整雙語內容（見各 .qmd
# 內的雙語段落），尚未拆成獨立的 en/ 檔案樹；本 profile 先建立可運作的骨架
# （lang 覆寫 + render 清單），實際雙語頁面拆分留待 Phase 1。
#
# 使用方式（順序不可顛倒）：
#   quarto render                 # 先建中文站 → docs/
#   quarto render --profile en    # 再建英文站 → docs/en/
# 原因：docs/en 位於 docs/ 之內，中文站 render 會清空 docs/ 並一併刪掉 docs/en。
#
# 已知落差：本 profile 只覆寫 navbar，未覆寫 _quarto.yml 的 sidebar，
# 故英文站側欄標題仍為中文。待 sidebar 英文化後補上。
# ---------------------------------------------------------------------------

# 輸出到 docs/en，避免與 zh-TW profile 共用 docs/ 而互相覆蓋
# （PROPOSAL §7.2：「輸出到 docs/ 與 docs/en/」）。
project:
  output-dir: docs/en

lang: en

website:
  title: "stat-skills-tutorials (English)"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: literacy/01-what-the-llm-sees.qmd
        text: Collaboration Literacy
      - href: prompts/index.qmd
        text: Prompt Library
      - href: verify/workflow.qmd
        text: Verification
      - href: external/reading-map.qmd
        text: External Reading Map

# render 清單：收錄已具備完整英文對照的頁面。
# L1 六課於 Phase 1 完成雙語撰寫後納入（每課中文段落後緊接英文對照，
# 非摘要），提示詞庫本身即雙語，external/reading-map.qmd 純英文。
# 尚未納入：verify/checklist-rtutor.qmd、verify/spot-the-error.qmd（內容待補）。
render:
  - index.qmd
  - literacy/01-what-the-llm-sees.qmd
  - literacy/02-one-answerable-question.qmd
  - literacy/03-criteria-first.qmd
  - literacy/04-which-analysis-which-persona.qmd
  - literacy/05-beyond-the-summary.qmd
  - literacy/06-after-the-answer.qmd
  - prompts/index.qmd
  - verify/workflow.qmd
  - verify/checklist-guider.qmd
  - external/reading-map.qmd
